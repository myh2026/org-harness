# CD：tag → 全量校验 → 打包（源码 + 编译产物）→ GitHub Release
# ----------------------------------------------------------------------------
# 推送 v* tag 时：
#   1. 与 CI 同套校验（check 28 模块 + 三连跑 demo + status 冒烟）
#   2. 打包：org-harness-<v>.tar.gz（源码 + dist 编译产物，剔除构建目录）
#            org-dist-demo-<v>.zip（dist/demo 单独包，便于官网/下游取数）
#   3. 发布说明：从 CHANGELOG.md 提取对应版本段落
#   4. 创建 GitHub Release 并附上两个包
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 校验 · 打包 · 发布
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 HSL 工具链（dhv-ts 解释器）
        run: bun scripts/setup-hsl.ts

      - name: dhv check 全量校验（28 模块）
        run: bun cli/org.ts check

      - name: 三连跑演示（编译产物再生，确保发布产物为最新）
        run: bun cli/org.ts demo

      - name: status 冒烟
        run: bun cli/org.ts status

      - name: 打包发行版
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # 先写 /tmp 再移回：避免「归档目录本身被写入 → file changed as we read it」
          TARBALL="/tmp/org-harness-${VERSION}.tar.gz"
          tar --exclude-vcs \
              --exclude=demo-run --exclude=.hsl-runs --exclude=node_modules \
              -czf "$TARBALL" .
          mv "$TARBALL" "org-harness-${VERSION}.tar.gz"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp -r dist/demo /tmp/pkg/org-dist-demo
          (cd /tmp/pkg && zip -qr "/tmp/org-dist-demo-${VERSION}.zip" org-dist-demo)
          mv "/tmp/org-dist-demo-${VERSION}.zip" .
          ls -lh org-harness-${VERSION}.tar.gz org-dist-demo-${VERSION}.zip

      - name: 提取 CHANGELOG 对应版本段落为发布说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v${VERSION}" '
            $0 == "## " ver { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "（CHANGELOG 未找到 ${GITHUB_REF_NAME} 段落，使用默认说明）" > release-notes.md
            echo "ORG v${VERSION} — 源码（hsl/）+ 编译产物（dist/）+ CI/CD。" >> release-notes.md
          fi
          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            org-harness-*.tar.gz
            org-dist-demo-*.zip
          body_path: release-notes.md
          generate_release_notes: true
